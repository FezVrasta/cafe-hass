name: 同步上游并发布汉化版

# 每月自动把上游 FezVrasta/cafe-hass 的新代码合并进来，
# 构建前端并发布带 cafe.zip 的 Release，供 HACS 直接安装/升级。
# 说明：由 GITHUB_TOKEN 产生的 push 不会再次触发本工作流，因此不会死循环。

on:
  schedule:
    # 每月 1 日 03:17 UTC（北京时间 11:17）
    - cron: "17 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zh-sync-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: FezVrasta/cafe-hass
  UPSTREAM_BRANCH: main

jobs:
  sync-upstream:
    name: 同步上游代码
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并上游 main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream "${UPSTREAM_BRANCH}" --tags

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git push origin HEAD:main
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            BRANCH="upstream-sync/$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: 合并上游更新（需要手动解决冲突）" \
              --body "自动同步上游 ${UPSTREAM_REPO} 时发生冲突，请手动解决后再合并。" \
              || echo "::warning::创建 PR 失败，请手动处理"
          fi

  build-release:
    name: 构建并发布
    needs: sync-upstream
    if: needs.sync-upstream.outputs.merged != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 判断是否需要发布
        id: check
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/cafe/manifest.json'))['version'])")
          TAG="v${VERSION}-zh-$(date +%Y%m%d)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "标签 ${TAG} 已存在，跳过发布"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*-zh-*' --sort=-creatordate | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            DIFF=$(git diff --name-only "${LAST_TAG}..HEAD" -- custom_components packages)
            if [ -z "$DIFF" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 无变更，跳过
        if: steps.check.outputs.changed != 'true'
        run: echo "与上一个汉化版本相比没有代码变更，跳过发布。"

      - name: 配置 Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 安装依赖
        if: steps.check.outputs.changed == 'true'
        run: |
          corepack enable
          yarn install --immutable

      - name: 构建前端
        if: steps.check.outputs.changed == 'true'
        run: yarn build

      - name: 打包组件
        if: steps.check.outputs.changed == 'true'
        run: |
          cd custom_components/cafe
          zip -r ../../cafe.zip . -x "*.DS_Store" "*/.DS_Store"
          cd ../..
          ls -la cafe.zip

      - name: 发布 Release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" cafe.zip \
            --title "${{ steps.check.outputs.tag }}" \
            --latest \
            --notes "C.A.F.E. 汉化版，基于上游 ${UPSTREAM_REPO} v${{ steps.check.outputs.version }} 构建。

          包含：
          - 前端 zh-Hans 简体中文语料（跟随 Home Assistant 界面语言自动切换）
          - 集成配置流程的中文翻译
          - 与上游保持同步的最新代码

          安装：HACS → 集成 → 自定义仓库 → 填写本仓库地址，类别选 Integration。"
